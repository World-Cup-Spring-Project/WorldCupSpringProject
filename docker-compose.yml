networks:
  arenacup:
    name: arenacup

services:
  postgres:
    image: postgres:17-alpine
    container_name: arenacup-postgres
    environment:
      POSTGRES_DB: arenacup
      POSTGRES_USER: arenacup
      POSTGRES_PASSWORD: arenacup
    ports:
      - "5433:5432"
    volumes:
      - arenacup-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U arenacup -d arenacup" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - arenacup

  mongo:
    image: mongo:8
    container_name: arenacup-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arenacup

  redis:
    image: redis:7-alpine
    container_name: arenacup-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - arenacup

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: arenacup-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arenacup

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: arenacup-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: arenacup-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - arenacup

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: arenacup-zipkin
    ports:
      - "9411:9411"
    networks:
      - arenacup

  eureka:
    build:
      context: ./eureka
      dockerfile: docker/Dockerfile
    image: arenacup/eureka:0.0.1-SNAPSHOT
    container_name: arenacup-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - arenacup

  auth-service:
    build:
      context: ../auth-service
      dockerfile: docker/Dockerfile
    image: arenacup/auth-service:0.0.1-SNAPSHOT
    container_name: auth-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: arenacup
      POSTGRES_USER: arenacup
      POSTGRES_PASSWORD: arenacup
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:9998/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - arenacup


  ms-core-data:
    build:
      context: ../ms-core-data
      dockerfile: docker/Dockerfile
    image: arenacup/ms-core-data:0.0.1-SNAPSHOT
    container_name: ms-core-data
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: arenacup
      POSTGRES_USER: arenacup
      POSTGRES_PASSWORD: arenacup
      WORLDCUP_API_URL: https://worldcup26.ir
      SYNC_ENABLED: "true"
      SYNC_ON_STARTUP: "true"
      SYNC_FALLBACK_TO_DB: "true"
      POSTGRES_SEED_ON_STARTUP: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - arenacup

  ms-matches:
    build:
      context: ../ms-matches
      dockerfile: docker/Dockerfile
    image: arenacup/ms-matches:0.0.1-SNAPSHOT
    container_name: ms-matches
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://mongo:27017/arenacup
      CORE_DATA_URL: http://ms-core-data:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      mongo:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
      ms-core-data:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - arenacup

  ms-tickets:
    build:
      context: ../ms-tickets
      dockerfile: docker/Dockerfile
    image: arenacup/ms-tickets:0.0.1-SNAPSHOT
    container_name: ms-tickets
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CORE_DATA_URL: http://ms-core-data:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
      ms-core-data:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - arenacup

  ms-engagement:
    build:
      context: ../ms-engagement
      dockerfile: docker/Dockerfile
    image: arenacup/ms-engagement:0.0.1-SNAPSHOT
    container_name: ms-engagement
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
      MATCHES_BASE_URL: http://ms-matches:8082
    depends_on:
      redis:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/liveness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - arenacup

  ms-analytics:
    build:
      context: ../ms-analytics
      dockerfile: docker/Dockerfile
    image: arenacup/ms-analytics:0.0.1-SNAPSHOT
    container_name: ms-analytics
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: arenacup
      POSTGRES_USER: arenacup
      POSTGRES_PASSWORD: arenacup
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORE_DATA_BASE_URL: http://ms-core-data:8081
      GAME_INFO_BASE_URL: http://ms-matches:8082
      ANALYTICS_SEED_ON_STARTUP: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
      ms-core-data:
        condition: service_healthy
      ms-matches:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8087/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - arenacup

  ms-logistics:
    build:
      context: ../ms-logistics
      dockerfile: docker/Dockerfile
    image: arenacup/ms-logistics:0.0.1-SNAPSHOT
    container_name: ms-logistics
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: arenacup
      POSTGRES_PASSWORD: arenacup
      CORE_DATA_BASE_URL: http://ms-core-data:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
      ms-core-data:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - arenacup

  api-gateway:
    build:
      context: ./gateway
      dockerfile: docker/Dockerfile
    image: arenacup/api-gateway:0.0.1-SNAPSHOT
    container_name: api-gateway
    ports:
      - "9999:9999"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      auth-service: # <--- O GATEWAY AGORA ESPERA O AUTH-SERVICE SUBIR
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_started
      ms-core-data:
        condition: service_healthy
      ms-matches:
        condition: service_healthy
      ms-tickets:
        condition: service_healthy
      ms-engagement:
        condition: service_healthy
      ms-analytics:
        condition: service_healthy
      ms-logistics:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:9999/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - arenacup

volumes:
  arenacup-postgres-data: